<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="css/style.css"><title>정류소 상세</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"></head><body>
<nav><a href="index.html" id="n1">🚲 지도</a><a href="analysis.html" id="n2">📊 분석</a><a href="detail.html" class="on">⭐ 상세/설정</a></nav>
<div class="wrap">
 <div class="card" id="info">정류소를 지도/목록에서 선택하세요.</div>
 <div class="card"><div id="map" style="height:300px"></div></div>
 <div class="card"><h3>⚖️ 추천 가중치 설정</h3>
  <label>날씨 <b id="vw"></b></label><input type="range" id="w" min="0" max="100">
  <label>거리 <b id="vd"></b></label><input type="range" id="d" min="0" max="100">
  <label>잔여 대수 <b id="vb"></b></label><input type="range" id="b" min="0" max="100">
  <p>이 정류소의 현재 추천 점수: <span class="big" id="score">-</span></p>
  <button id="save">가중치 저장</button> <span class="small">저장하면 지도·분석 페이지 점수에도 반영됩니다.</span></div>
 <div class="card"><h3>⭐ 내 즐겨찾기</h3><ul id="favList"></ul></div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="js/common.js"></script><script src="js/detail.js"></script></body></html>
